name: Baseline checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
      - name: Install locked project and development dependencies
        run: uv sync --locked --group dev
      - name: Verify the installed package, CLI, and offline checks
        env:
          UV_OFFLINE: "true"
        run: |
          uv run python -c "from pathlib import Path; import agentlab; assert Path(agentlab.__file__).resolve() == Path('src/agentlab/__init__.py').resolve()"
          uv run agentlab --help
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .
