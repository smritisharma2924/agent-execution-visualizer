[project]
name = "agentlab"
version = "0.1.0.dev0"
description = "Local execution traces for Python agents"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
agentlab = "agentlab.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Copying keeps the editable install's .pth file visible to Python on macOS.
link-mode = "copy"
